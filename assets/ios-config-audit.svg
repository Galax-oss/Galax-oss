<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-label="ios-config-audit">
  <style>
    .fond   { fill: #ffffff; stroke: #d1d9e0; }
    .titre  { fill: #0969da; font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .desc   { fill: #59636e; font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .metric { fill: #1f2328; font: 700 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .unite  { fill: #59636e; font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .pied   { fill: #59636e; font: 400 10.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .accent { fill: #1BA0D7; }
    @media (prefers-color-scheme: dark) {
      .fond   { fill: #0d1117; stroke: #3d444d; }
      .titre  { fill: #4493f8; }
      .desc   { fill: #9198a1; }
      .metric { fill: #f0f6fc; }
      .unite  { fill: #9198a1; }
      .pied   { fill: #9198a1; }
    }
</style>
  <rect class="fond" x="0.5" y="0.5" width="419" height="149" rx="10"/>
  <rect class="accent" x="0.5" y="0.5" width="4" height="149" rx="2"/>
  <text class="titre" x="22" y="30">ios-config-audit</text>
  <text class="desc" x="22" y="50">Durcissement d'une configuration Cisco IOS</text>
  <text class="metric" x="22" y="92">16 / 16</text>
  <text class="unite" x="22" y="110">écarts sur une config d'usine</text>
  <line x1="22" y1="122" x2="398" y2="122" stroke="#d1d9e0" stroke-width="1" opacity="0.5"/>
  <text class="pied" x="22" y="138">acces, auth, services, logs, interfaces</text>
  <text class="pied" x="398" y="138" text-anchor="end">47 tests</text>
</svg>
